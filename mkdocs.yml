          - Monitoring: K8s-Addons/Monitoring/prometheus-grafana.md
          - Logging: K8s-Addons/Logging/fluentbit.md
          - GitOps: K8s-Addons/GitOps/argocd.md
          - Identity: K8s-Addons/Identity/keycloak.md
          - LoadBalancer: K8s-Addons/LoadBalancer/metallb.md
          - CSI: K8s-Addons/CSI/csi.md
      - Rancher:
